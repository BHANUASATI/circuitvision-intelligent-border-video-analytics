global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: ibvap
    environment: production

scrape_configs:
  - job_name: ibvap_backend
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics

  - job_name: ibvap_ai_service
    static_configs:
      - targets: ["ai_service:8001"]
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
      - targets: ["postgres:5432"]

  - job_name: redis
    static_configs:
      - targets: ["redis:6379"]
