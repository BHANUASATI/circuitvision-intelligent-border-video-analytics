# ============================================================
# IBVAP — Primary Server Block
# HTTP (port 80) → redirect to HTTPS
# HTTPS (port 443) → reverse proxy to frontend + backend + AI service
# ============================================================

# ── HTTP: redirect all to HTTPS ───────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge passthrough (Let's Encrypt / certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ── HTTPS: main application ───────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;                          # Replace with actual domain in production

    # ── TLS ───────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Modern TLS — TLS 1.2+ only
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # HSTS — 1 year, include subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # OCSP stapling
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # ── Client limits ─────────────────────────────────────────
    client_max_body_size  50M;            # face image uploads
    limit_conn conn_limit 50;

    # ── Static Frontend ───────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Cache static assets at proxy level
        proxy_cache_valid 200 1d;
    }

    # ── Backend REST API ──────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # CORS preflight pass-through (backend handles CORS)
        proxy_hide_header Access-Control-Allow-Origin;
    }

    # ── Auth endpoints — stricter rate limit ──────────────────
    location /api/v1/auth/login {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Connection      "";
    }

    # ── WebSocket — alert stream ──────────────────────────────
    location /api/v1/ws/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket timeout — longer than ping interval (25s)
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;
    }

    # ── AI Service internal API (admin/ops use only) ──────────
    location /ai/ {
        # Restrict to internal network — deny public access
        allow  172.16.0.0/12;
        allow  10.0.0.0/8;
        allow  192.168.0.0/16;
        allow  127.0.0.1;
        deny   all;

        rewrite ^/ai/(.*)$ /api/v1/$1 break;
        proxy_pass         http://ai_service;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   Connection      "";

        proxy_read_timeout 120s;
    }

    # ── Health / metrics (internal only) ─────────────────────
    location /health {
        access_log off;
        proxy_pass http://backend/health;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny  all;
    }

    location /metrics {
        access_log off;
        proxy_pass http://backend/metrics;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny  all;
    }

    # ── Block common attack paths ─────────────────────────────
    location ~* \.(git|env|htaccess|htpasswd|ini|log|sh|sql|bak|conf)$ {
        deny all;
        return 404;
    }

    location ~* /\. {
        deny all;
        return 404;
    }
}


# ── Grafana dashboard (internal port, admin use) ──────────────
server {
    listen 3001 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Restrict to internal networks only
    allow  172.16.0.0/12;
    allow  10.0.0.0/8;
    allow  192.168.0.0/16;
    allow  127.0.0.1;
    deny   all;

    location / {
        proxy_pass         http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
